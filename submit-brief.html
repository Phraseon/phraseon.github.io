<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Brief – Phraseon</title>
    <style>
        body {
            background: #1A1A1A;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            background: #2A2A2A;
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        h2 {
            color: #4D7CFF;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #444;
            background: #1A1A1A;
            color: white;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
        }
        button {
            background: #4D7CFF;
            color: #1A1A1A;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }
        button:hover {
            background: #6B92FF;
        }
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-link a {
            color: #4D7CFF;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>📧 Submit a Licensing Brief</h2>
        <!-- Auto‑submits to phraseon.official@gmail.com via FormSubmit (no registration needed) -->
        <form action="https://formsubmit.co/phraseon.official@gmail.com" method="POST">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Brief / Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <!-- After submit, redirect back to the sync catalog -->
            <input type="hidden" name="_next" value="https://phraseon.io/03_i_carry_the_glow.html">

            <!-- Email subject line -->
            <input type="hidden" name="_subject" value="New Sync Brief Submission from Phraseon.io">

            <button type="submit">Send Brief</button>
        </form>
        <div class="back-link">
            <a href="index.html">← Back</a>
        </div>
    </div>
</body>
</html>
